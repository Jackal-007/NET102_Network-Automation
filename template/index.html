<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps // Automation Console</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');

        :root {
            --bg-color: #0a0f18;
            --panel-bg: #111827;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.8s ease-out;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .title-area h1 {
            margin: 0;
            font-size: 28px;
            font-family: 'Fira Code', monospace;
            color: var(--accent-cyan);
            letter-spacing: -1px;
        }

        .title-area p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .status-badge {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: 'Fira Code', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        .controls {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .controls p {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        button {
            background-color: transparent;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button:hover:not(:disabled) {
            background-color: rgba(6, 182, 212, 0.1);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        button:disabled {
            border-color: var(--text-muted);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.5;
        }

        #status-message {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .command-block {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease-out;
        }

        .command-header {
            background: #0f172a;
            padding: 10px 15px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: var(--accent-cyan);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        .command-header::before {
            content: "❯";
            margin-right: 8px;
            color: var(--accent-green);
        }

        pre {
            margin: 0;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-main);
            overflow-x: auto;
            white-space: pre-wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: var(--text-muted);
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-area">
                <h1>NetOps Automation</h1>
                <p>Router Configuration & Status Collector</p>
            </div>
            <div class="status-badge">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">IDLE</span>
            </div>
        </header>

        <div class="controls">
            <p>Target: <strong>Cisco IOS (192.168.10.41)</strong><br>Commands: 3 queued</p>
            <button id="runBtn">Execute Script</button>
        </div>

        <div id="status-message"></div>
        <div id="output-container"></div>
    </div>

    <script>
        const btn = document.getElementById('runBtn');
        const statusDiv = document.getElementById('status-message');
        const outputContainer = document.getElementById('output-container');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        const API_URL = 'http://192.168.10.119:5000/api/run-commands'; 

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Running...';
            statusDiv.style.display = 'none';
            outputContainer.innerHTML = '';

            statusDot.classList.add('active');
            statusText.textContent = 'CONNECTING';
            statusText.style.color = 'var(--accent-cyan)';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Unknown API error');
                }

                statusDot.classList.remove('active');
                statusDot.style.backgroundColor = 'var(--accent-green)';
                statusText.textContent = 'SUCCESS';
                statusText.style.color = 'var(--accent-green)';
                
                statusDiv.className = 'status-success';
                statusDiv.innerHTML = '✅ Execution complete. Output buffered below.';
                statusDiv.style.display = 'block';

                for (const [cmd, out] of Object.entries(data.results)) {
                    const block = document.createElement('div');
                    block.className = 'command-block';

                    const h = document.createElement('div');
                    h.className = 'command-header';
                    h.textContent = cmd;

                    const pre = document.createElement('pre');
                    pre.textContent = out;

                    block.appendChild(h);
                    block.appendChild(pre);
                    outputContainer.appendChild(block);
                }

                setTimeout(() => {
                    statusDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

            } catch (err) {
                statusDot.classList.remove('active');
                statusDot.style.backgroundColor = 'var(--accent-red)';
                statusText.textContent = 'ERROR';
                statusText.style.color = 'var(--accent-red)';
                
                statusDiv.className = 'status-error';
                statusDiv.innerHTML = `❌ Connection Failed: ${err.message}`;
                statusDiv.style.display = 'block';
                
            } finally {
                btn.disabled = false;
                btn.textContent = 'Execute Script';
            }
        });
    </script>

</body>
</html>
